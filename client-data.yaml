REVIEWER_1_NAME: "Drew & Karyn Dunavant"
REVIEWER_1_DATE: "6 months ago"
REVIEWER_1_TEXT: "My husband trained with Master Rick 18 years ago, at age 18. Now at age 36 he's returned with our two oldest kids in the adult class, and it is such a sweet gift. Master Rick and Sensei Katrina are the most genuine, caring souls you'll find and really love the students well."

REVIEWER_2_NAME: "Kalene Scott"
REVIEWER_2_DATE: "6 months ago"
REVIEWER_2_TEXT: "My son has had an absolutely incredible experience at Aamerican Colleges of Jiu Jitsu and Karate. Their approach balances discipline, respect, and fun in a way that keeps students fully engaged while helping them grow both physically and mentally. My son has grown exponentially in all aspects of his life."

REVIEWER_3_NAME: "Carrie Finch"
REVIEWER_3_DATE: "8 months ago"
REVIEWER_3_TEXT: "All 3 of my children have attended both after-school care and summer programs over the past 8 years! Master Rick and Sensei Katrina are wonderful and they run a fantastic program! The kids not only learn self-defense through jiu jitsu and karate, but participate in a variety of other activities as well!"

